name: Build WhateverXe kext
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build kext
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload kext
        uses: actions/upload-artifact@v4
        with:
          name: WhateverXe-0.7.0-6bank
          path: $HOME/wex-patch-build/src/build/WhateverXe.kext
          if-no-files-found: error
