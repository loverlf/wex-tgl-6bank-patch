name: Build patched WhateverXe (TGL 6-bank)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcrun --find clang++
          python3 --version
          sw_vers

      - name: Build patched kext
        env:
          WORK: ${{ github.workspace }}/wex
          WEX_TAG: "0.7.0"
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package kext (keep bundle layout)
        run: |
          ditto -c -k --keepParent \
            "${GITHUB_WORKSPACE}/wex/src/build/WhateverXe.kext" \
            "${GITHUB_WORKSPACE}/WhateverXe-0.7.0-6banks.zip"
          ls -l "${GITHUB_WORKSPACE}/WhateverXe-0.7.0-6banks.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhateverXe-0.7.0-6banks
          path: WhateverXe-0.7.0-6banks.zip
          if-no-files-found: error
